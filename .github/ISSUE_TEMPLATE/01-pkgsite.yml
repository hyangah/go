name: Pkg.go.dev bugs or feature requests
description: Issues or feature requests for the documentation site
title: "x/pkgsite: issue title"
labels: ["pkgsite"]
body:
  - type: markdown
    attributes:
      value: "Please answer these questions before submitting your issue. Thanks!"
  - type: input
    id: url
    attributes:
      label: "What is the URL of the page with the issue?"
    validations:
      required: true
  - type: input
    id: user-agent
    attributes:
      label: "What is your user agent?"
      description: "Include if reporting a browser or layout issue: https://www.google.com/search?q=what+is+my+user+agent"
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: "Screenshot"
      description: "Please paste a screenshot of the page."
    validations:
      required: false
  - type: textarea
    id: what-did-you-do
    attributes:
      label: "What did you do?"
      description: "If possible, provide a recipe for reproducing the error. Starting with a Private/Incognito tab/window may help rule out problematic browser extensions."
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: "What did you see happen?"
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: "What did you expect to see?"
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: "Are you blocked by this issue?"
      options:
        - "Not affected — theoretical issue, documentation fix, or feature request"
        - "Minor — low impact or edge case"
        - "Impaired — hitting this in practice, but have a workaround"
        - "Blocked — cannot proceed, no reasonable workaround"
      default: 0
    validations:
      required: true
  - type: textarea
    id: impact-details
    attributes:
      label: "Impact and urgency justification"
      description: |
        Explain how this affects your workflow or users, and what workaround (if any) you are using.
        If reporting a feature request or minor UI issue, write "N/A".
    validations:
      required: true
