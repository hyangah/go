name: Gopls bugs or feature requests
description: Issues or feature requests for the Go language server (gopls)
title: "x/tools/gopls: issue title"
labels: ["gopls", "Tools"]
body:
  - type: markdown
    attributes:
      value: "Please answer these questions before submitting your issue. Be concise in your descriptions. Thanks!"
  - type: textarea
    id: gopls-version
    attributes:
      label: "gopls version"
      description: "Output of `gopls -v version` on the command line"
      value: |
        <details><summary>Details</summary>

        ```
        PASTE OUTPUT HERE
        ```

        </details>
    validations:
      required: true
  - type: textarea
    id: go-env
    attributes:
      label: "go env"
      description: "Output of `go env` on the command line in your workspace directory"
      value: |
        <details><summary>Details</summary>

        ```shell
        PASTE OUTPUT HERE
        ```

        </details>
    validations:
      required: true
  - type: textarea
    id: what-did-you-do
    attributes:
      label: "What did you do?"
      description: "If possible, provide a recipe for reproducing the error. A complete runnable program is good. A link on [go.dev/play](https://go.dev/play) is better. A failing unit test is the best."
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: "What did you see happen?"
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: "What did you expect to see?"
    validations:
      required: true
  - type: textarea
    id: editor-and-settings
    attributes:
      label: "Editor and settings"
      description: "Your editor and any settings you have configured (for example, your VSCode settings.json file)"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: "Logs"
      description: "If possible please include gopls logs. Instructions for capturing them can be found here: https://github.com/golang/tools/blob/master/gopls/doc/troubleshooting.md#capture-logs"
    validations:
      required: false
  - type: dropdown
    id: discovery
    attributes:
      label: "How did you discover this issue?"
      options:
        - "Code inspection or AI/LLM audit (not hit in practice)"
        - "Feature request or documentation issue"
        - "Fuzzing or automated testing"
        - "While testing or upgrading gopls / Go"
        - "In daily editor use on a real project"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: "Are you blocked by this issue?"
      options:
        - "Not affected — theoretical issue, documentation fix, or feature request"
        - "Minor — low impact or edge case"
        - "Impaired — hitting this in practice, but have a workaround"
        - "Blocked — cannot proceed, no reasonable workaround"
      default: 0
    validations:
      required: true
  - type: textarea
    id: impact-details
    attributes:
      label: "Discovery and impact details"
      description: |
        Briefly share how you encountered and narrowed down this issue, how it affects your workflow, and any workaround you are using.
        If you have not hit this in practice (for example, found by reading code or with an AI/LLM tool), mention the method/tool used or leave blank—do not speculate on hypothetical impact.
      placeholder: "ex. Hit while editing a 200-package workspace; narrowed down to the minimal reproducer above. Workaround: restarting gopls."
    validations:
      required: false
  - type: checkboxes
    id: verification
    attributes:
      label: "Verification"
      options:
        - label: "I personally verified the behavior or details reported above (unverified AI/LLM-generated reports will be closed)."
          required: true
